<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakenBrain — v3.0 (Jarvis Edition)</title>
<style>
/* CSS Reset & Core */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#030308;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8eaf6}
#c{position:fixed;inset:0;z-index:0}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}

/* Glassmorphism V2 Styles */
.glass{background:rgba(18,18,32,.65);backdrop-filter:blur(25px) saturate(160%);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,0.4)}

/* UI Elements */
#top{position:absolute;top:20px;left:20px;right:20px;height:60px;
  display:flex;align-items:center;gap:15px;padding:0 20px;border-radius:18px;
  pointer-events:all}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:#5EE6FF;box-shadow:0 0 12px #5EE6FF}
.brand-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff}
#statusText{font-size:11px;color:rgba(94,230,255,0.7);text-transform:uppercase;letter-spacing:1px;margin-left:5px}
#clock{margin-left:auto;font-family:monospace;font-size:16px;color:#5EE6FF;opacity:0.8}

#left,#right{position:absolute;top:100px;width:240px;border-radius:20px;
  padding:20px;pointer-events:all;opacity:0}
#left{left:20px}
#right{right:20px}

.ptitle{font-size:10px;letter-spacing:3px;color:rgba(94,230,255,0.5);
  margin-bottom:15px;font-weight:700;text-transform:uppercase}
.metric{margin-bottom:20px}
.mval{font-size:26px;font-weight:800;color:#fff;font-family:monospace}
.mbar{height:4px;background:rgba(255,255,255,0.1);margin-top:8px;border-radius:2px;overflow:hidden}
.mfill{height:100%;width:0%;background:linear-gradient(90deg,#5EE6FF,#8B7CFF);transition:width 1s ease-out}

#terminal{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  width:min(700px,calc(100% - 40px));display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 25px;border-radius:35px;pointer-events:all}
#input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px}
#input::placeholder{color:rgba(255,255,255,0.3)}

.round-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
#micBtn{background:rgba(255,255,255,0.08)}
#micBtn.active{background:rgba(94,230,255,0.2);box-shadow:0 0 15px rgba(94,230,255,0.3)}
#sendBtn{background:linear-gradient(135deg,#5EE6FF,#8B7CFF);color:#000}

#bstateWrap{position:absolute;top:100px;left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;opacity:0}
#bstate{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,0.5);font-weight:700}

/* Insights System */
#insights{position:absolute;top:160px;right:20px;width:300px;
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ins{padding:15px;border-radius:15px;font-size:13px;background:rgba(94,230,255,0.08);
  border-left:4px solid #5EE6FF;color:#fff;backdrop-filter:blur(10px)}

/* Animation Classes */
.thinkdots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.tdot{width:5px;height:5px;border-radius:50%;background:#5EE6FF}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top" class="glass">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">MakenBrain</span>
      <span id="statusText">System Ready</span>
    </div>
    <div id="clock">00:00:00</div>
  </div>

  <div id="bstateWrap">
    <div id="bstate">MONITORING</div>
    <div class="thinkdots" id="thinkDots" style="display:none">
      <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
    </div>
  </div>

  <div id="left" class="glass">
    <div class="ptitle">Neural Stats</div>
    <div class="metric">
      <div class="ptitle" style="font-size:9px">Memory Capacity</div>
      <div class="mval" id="mc">0</div>
      <div class="mbar"><div class="mfill" id="mb1"></div></div>
    </div>
    <div class="metric">
      <div class="ptitle" style="font-size:9px">Synaptic Links</div>
      <div class="mval" id="gn">0</div>
      <div class="mbar"><div class="mfill" id="mb2" style="background:#8B7CFF"></div></div>
    </div>
  </div>

  <div id="insights"></div>

  <div id="terminal" class="glass">
    <button class="round-btn" id="micBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <input id="input" type="text" placeholder="Accessing neural link..." autocomplete="off">
    <button class="round-btn" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<!-- Reliable CDNJS Links -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
const API = ''; // Relative path for reliability
let activity = 0;
let scene, camera, renderer, orb, particles;

// Initialization
function init() {
  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  // 1. Organic Orb (v3 Enhanced)
  const geom = new THREE.IcosahedronGeometry(1.5, 5); // Optimized subdivision
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      time: { value: 0 },
      act: { value: 0 },
      colorA: { value: new THREE.Color(0x5EE6FF) },
      colorB: { value: new THREE.Color(0x8B7CFF) }
    },
    vertexShader: `
      varying vec2 vUv;
      varying float vNoise;
      uniform float time;
      uniform float act;
      
      // Simple Noise function
      float mod289(float x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
      vec4 mod289(vec4 x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
      vec4 perm(vec4 x){return mod289(((x * 34.0) + 1.0) * x);}
      float noise(vec3 p){
          vec3 a = floor(p);
          vec3 d = p - a;
          d = d * d * (3.0 - 2.0 * d);
          vec4 b = a.xxyy + vec4(0.0, 1.0, 0.0, 1.0);
          vec4 k1 = perm(b.xyxy);
          vec4 k2 = perm(k1.xyxy + b.zzww);
          vec4 c = k2 + a.zzzz;
          vec4 g1 = perm(c);
          vec4 g2 = perm(c + 1.0);
          vec4 f1 = fract(g1 * (1.0 / 41.0));
          vec4 f2 = fract(g2 * (1.0 / 41.0));
          vec4 t1 = f1 - 0.5;
          vec4 t2 = f2 - 0.5;
          float p1 = dot(t1, d);
          float p2 = dot(t2, d - 1.0);
          return mix(p1, p2, d.x);
      }

      void main() {
        vUv = uv;
        vNoise = noise(position * 0.5 + time * 0.2);
        float displacement = vNoise * (0.3 + act * 0.5);
        vec3 newPos = position + normal * displacement;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      varying float vNoise;
      uniform vec3 colorA;
      uniform vec3 colorB;
      void main() {
        vec3 finalColor = mix(colorA, colorB, vNoise + 0.5);
        gl_FragColor = vec4(finalColor, 0.85);
      }
    `,
    transparent: true,
    wireframe: true
  });
  
  orb = new THREE.Mesh(geom, mat);
  scene.add(orb);

  // 2. GPU-like Particles Flow Field
  const pCount = 2000;
  const pGeom = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  for(let i=0; i<pCount*3; i++) pPos[i] = (Math.random() - 0.5) * 10;
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({color: 0x5EE6FF, size: 0.02, transparent: true, opacity: 0.5});
  particles = new THREE.Points(pGeom, pMat);
  scene.add(particles);

  animate();
  startHUD();
}

function animate() {
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;
  
  orb.material.uniforms.time.value = time;
  orb.material.uniforms.act.value = activity;
  orb.rotation.y += 0.005;
  orb.rotation.z += 0.003;
  
  // Update particles flow
  const pos = particles.geometry.attributes.position.array;
  for(let i=0; i<pos.length; i+=3) {
    pos[i+1] += Math.sin(time + pos[i]) * 0.01;
    if(pos[i+1] > 5) pos[i+1] = -5;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  
  renderer.render(scene, camera);
}

function startHUD() {
  // GSAP Entrance Animations
  gsap.from("#top", {y: -100, opacity: 0, duration: 1.2, ease: "expo.out"});
  gsap.from("#left", {x: -100, opacity: 0, duration: 1.2, ease: "expo.out", delay: 0.2, onComplete: () => gsap.to("#left", {opacity: 1})});
  gsap.to("#left", {opacity: 1, delay: 0.2});
  gsap.from("#terminal", {y: 100, opacity: 0, duration: 1.2, ease: "expo.out", delay: 0.4});
  gsap.to("#bstateWrap", {opacity: 1, duration: 1, delay: 0.6});
  
  // Clock
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('fr-FR');
  }, 1000);
}

// Stats & Fetching
async function fetchStats() {
  try {
    const resM = await fetch(`${API}/memory/stats`);
    const dataM = await resM.json();
    document.getElementById('mc').textContent = dataM.total_memories || 0;
    document.getElementById('mb1').style.width = Math.min((dataM.total_memories/1000)*100, 100) + '%';
    
    const resG = await fetch(`${API}/graph/stats`);
    const dataG = await resG.json();
    document.getElementById('gn').textContent = dataG.nodes || 0;
    document.getElementById('mb2').style.width = Math.min((dataG.nodes/500)*100, 100) + '%';
    
    document.getElementById('statusText').textContent = "Neural Link Active";
  } catch(e) {
    document.getElementById('statusText').textContent = "Standby Mode";
  }
}

// Interaction
const input = document.getElementById('input');
async function send() {
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  
  activity = 1;
  document.getElementById('thinkDots').style.display = 'flex';
  gsap.to("#bstate", {text: "ANALYZING", duration: 0.3});
  
  try {
    const res = await fetch(`${API}/chat/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, use_memory: true})
    });
    const data = await res.json();
    
    showInsight(data.response.substring(0, 100) + "...");
    
  } catch(e) {
    showInsight("Error: Could not reach neural cortex.");
  } finally {
    setTimeout(() => {
      activity = 0;
      document.getElementById('thinkDots').style.display = 'none';
      document.getElementById('bstate').textContent = "MONITORING";
    }, 2000);
  }
}

function showInsight(text) {
  const box = document.getElementById('insights');
  const div = document.createElement('div');
  div.className = 'ins';
  div.textContent = text;
  box.prepend(div);
  gsap.from(div, {x: 50, opacity: 0, duration: 0.5});
  setTimeout(() => div.remove(), 8000);
}

document.getElementById('sendBtn').onclick = send;
input.onkeydown = (e) => e.key === 'Enter' && send();

// Mic Placeholder
document.getElementById('micBtn').onclick = () => {
  document.getElementById('micBtn').classList.toggle('active');
  showInsight("Neural audio link toggled.");
};

window.onresize = () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};

window.onload = () => {
  init();
  fetchStats();
  setInterval(fetchStats, 15000);
};
</script>
</body>
</html>
