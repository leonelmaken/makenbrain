<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MakenBrain — Graphe de Neurones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  /* ── Header ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 100;
  }
  .logo {
    font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #a78bfa, #38bdf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 100px;
    background: rgba(167,139,250,0.15); color: #a78bfa;
    border: 1px solid rgba(167,139,250,0.25);
  }
  #stats-bar {
    display: flex; gap: 20px; margin-left: auto; font-size: 12px;
    color: rgba(226,232,240,0.5);
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-val { color: #e2e8f0; font-weight: 500; }

  /* ── Canvas ── */
  svg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

  /* ── Nodes ── */
  .node circle {
    stroke-width: 1.5;
    cursor: pointer;
    transition: r 0.2s;
  }
  .node:hover circle { filter: brightness(1.3); }
  .node text {
    pointer-events: none;
    fill: rgba(226,232,240,0.85);
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* ── Links ── */
  .link {
    stroke: rgba(255,255,255,0.08);
    stroke-width: 1px;
    fill: none;
  }
  .link.strong { stroke: rgba(167,139,250,0.3); stroke-width: 1.5px; }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(15,15,25,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 16px;
    font-size: 13px; max-width: 280px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    opacity: 0; transition: opacity 0.15s;
    z-index: 200;
  }
  #tooltip .t-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  #tooltip .t-row { color: rgba(226,232,240,0.6); margin-top: 3px; }
  #tooltip .t-row span { color: #e2e8f0; }

  /* ── Panel latéral ── */
  #panel {
    position: fixed; right: 0; top: 53px; bottom: 0; width: 300px;
    background: rgba(10,10,15,0.92);
    border-left: 1px solid rgba(255,255,255,0.06);
    padding: 20px;
    backdrop-filter: blur(12px);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
    z-index: 90;
  }
  #panel.open { transform: translateX(0); }
  #panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: #a78bfa; }
  #panel .p-concept { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  #panel .p-meta { font-size: 12px; color: rgba(226,232,240,0.5); margin-bottom: 16px; }
  .neighbor-item {
    padding: 8px 10px; border-radius: 7px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 6px; font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .neighbor-item:hover { background: rgba(167,139,250,0.1); }
  .neighbor-item .n-name { font-weight: 500; }
  .neighbor-item .n-meta { color: rgba(226,232,240,0.45); font-size: 11px; margin-top: 2px; }
  .hop-1 { border-left: 2px solid #a78bfa; }
  .hop-2 { border-left: 2px solid #38bdf8; }
  .hop-3 { border-left: 2px solid #34d399; }

  /* ── Contrôles ── */
  #controls {
    position: fixed; bottom: 24px; left: 24px;
    display: flex; gap: 8px; z-index: 100;
  }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: none;
    font-size: 12px; font-weight: 500; cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: rgba(226,232,240,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(167,139,250,0.2); color: #a78bfa; }

  /* ── Search ── */
  #search-wrap {
    position: fixed; bottom: 24px; right: 320px;
    z-index: 100;
  }
  #search {
    background: rgba(15,15,25,0.9);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: #e2e8f0;
    padding: 8px 14px; font-size: 13px; width: 200px;
    outline: none;
  }
  #search:focus { border-color: rgba(167,139,250,0.5); }
  #search::placeholder { color: rgba(226,232,240,0.3); }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0a0a0f; z-index: 500;
    gap: 16px;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(167,139,250,0.2);
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: rgba(226,232,240,0.5); }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>Connexion à MakenBrain...</p>
</div>

<!-- Header -->
<div id="header">
  <span class="logo">🧠 MakenBrain</span>
  <span class="badge">Graphe de Neurones</span>
  <div id="stats-bar">
    <div class="stat">Nœuds <span class="stat-val" id="s-nodes">—</span></div>
    <div class="stat">Arêtes <span class="stat-val" id="s-edges">—</span></div>
    <div class="stat">Densité <span class="stat-val" id="s-density">—</span></div>
  </div>
</div>

<!-- SVG graph -->
<svg id="svg">
  <g id="zoom-group">
    <g id="links-group"></g>
    <g id="nodes-group"></g>
  </g>
</svg>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Panel latéral -->
<div id="panel">
  <h3>Connexions</h3>
  <div class="p-concept" id="p-name"></div>
  <div class="p-meta" id="p-meta"></div>
  <div id="p-neighbors"></div>
</div>

<!-- Contrôles -->
<div id="controls">
  <button class="btn" onclick="reload()">↻ Actualiser</button>
  <button class="btn" onclick="resetZoom()">⊙ Centrer</button>
  <button class="btn" onclick="togglePanel()">✕ Fermer</button>
</div>

<!-- Recherche -->
<div id="search-wrap">
  <input id="search" placeholder="Chercher un concept..." oninput="highlightSearch(this.value)">
</div>

<script>
const API = 'http://localhost:8000';

// ── Palettes par type ─────────────────────────────────────────────────────────
const COLOR = {
  technologie: { fill: '#7c3aed', stroke: '#a78bfa' },
  domaine:     { fill: '#0369a1', stroke: '#38bdf8' },
  projet:      { fill: '#047857', stroke: '#34d399' },
  architecture:{ fill: '#b45309', stroke: '#fbbf24' },
  concept:     { fill: '#374151', stroke: '#9ca3af' },
  acronyme:    { fill: '#831843', stroke: '#f472b6' },
  technique:   { fill: '#1e3a5f', stroke: '#60a5fa' },
};

function colorFor(type) {
  return COLOR[type] || COLOR.concept;
}

let simulation, allNodes = [], allLinks = [];
const svg = d3.select('#svg');
const g   = svg.select('#zoom-group');

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

function resetZoom() {
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, window.innerHeight/2).scale(0.8));
}

// ── Charger les données ───────────────────────────────────────────────────────
async function load() {
  try {
    const [mapRes, statsRes] = await Promise.all([
      fetch(`${API}/graph/map?max_nodes=100`),
      fetch(`${API}/graph/stats`),
    ]);
    const map   = await mapRes.json();
    const stats = await statsRes.json();

    document.getElementById('s-nodes').textContent   = stats.nodes || 0;
    document.getElementById('s-edges').textContent   = stats.edges || 0;
    document.getElementById('s-density').textContent = stats.density || '0';
    document.getElementById('loading').classList.add('hidden');

    if (!map.nodes || map.nodes.length === 0) {
      showEmpty();
      return;
    }
    render(map.nodes, map.edges || []);
  } catch (e) {
    document.querySelector('#loading p').textContent =
      '⚠️ Impossible de joindre localhost:8000 — Cerveau démarré ?';
  }
}

function showEmpty() {
  document.getElementById('loading').classList.remove('hidden');
  document.querySelector('#loading p').textContent =
    'Graphe vide — Lance POST /graph/build dans Swagger.';
  document.querySelector('.spinner').style.display = 'none';
}

// ── Rendu ─────────────────────────────────────────────────────────────────────
function render(nodes, links) {
  allNodes = nodes.map(d => ({ ...d }));
  allLinks = links.map(d => ({ ...d }));

  // Nettoyer
  g.select('#links-group').selectAll('*').remove();
  g.select('#nodes-group').selectAll('*').remove();

  // Rayon basé sur la fréquence et les connexions
  function radius(d) {
    return Math.min(40, 5 + Math.sqrt(d.frequency || 1) * 3 + (d.connections || 0) * 0.5);
  }

  const link = g.select('#links-group')
    .selectAll('line').data(allLinks).join('line')
    .attr('class', d => `link ${d.weight > 0.7 ? 'strong' : ''}`)
    .attr('stroke-opacity', d => Math.max(0.05, d.weight * 0.5));

  const node = g.select('#nodes-group')
    .selectAll('g').data(allNodes).join('g')
    .attr('class', 'node')
    .call(drag())
    .on('click', (e, d) => openPanel(d))
    .on('mouseover', (e, d) => showTooltip(e, d))
    .on('mousemove', e => moveTooltip(e))
    .on('mouseout', () => hideTooltip());

  node.append('circle')
    .attr('r', d => radius(d))
    .attr('fill', d => colorFor(d.type).fill)
    .attr('stroke', d => colorFor(d.type).stroke)
    .attr('fill-opacity', 0.75);

  node.append('text')
    .text(d => d.id.length > 16 ? d.id.slice(0, 14) + '…' : d.id)
    .style('font-size', d => `${Math.min(11, 8 + radius(d) * 0.15)}px`)
    .attr('dy', d => radius(d) + 11);

  // Simulation force
  simulation = d3.forceSimulation(allNodes)
    .force('link', d3.forceLink(allLinks)
      .id(d => d.id)
      .distance(d => 80 + (1 - d.weight) * 60)
      .strength(d => d.weight * 0.4))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(0, 0))
    .force('collision', d3.forceCollide().radius(d => radius(d) + 8))
    .on('tick', () => {
      link
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  resetZoom();
}

// ── Drag ──────────────────────────────────────────────────────────────────────
function drag() {
  return d3.drag()
    .on('start', (e, d) => {
      if (!e.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => {
      if (!e.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');
function showTooltip(e, d) {
  tip.innerHTML = `
    <div class="t-name">${d.id}</div>
    <div class="t-row">Type <span>${d.type}</span></div>
    <div class="t-row">Fréquence <span>${d.frequency}</span></div>
    <div class="t-row">Connexions <span>${d.connections}</span></div>
  `;
  tip.style.opacity = 1;
  moveTooltip(e);
}
function moveTooltip(e) {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function hideTooltip() { tip.style.opacity = 0; }

// ── Panel latéral ─────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
let panelOpen = false;

async function openPanel(d) {
  document.getElementById('p-name').textContent = d.id;
  document.getElementById('p-meta').textContent =
    `${d.type} · ${d.connections} connexions · fréquence ${d.frequency}`;
  document.getElementById('p-neighbors').innerHTML = '<div style="color:rgba(226,232,240,0.4);font-size:12px">Chargement…</div>';

  panel.classList.add('open');
  panelOpen = true;

  try {
    const res = await fetch(`${API}/graph/explore`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concept: d.id, depth: 2 }),
    });
    const data = await res.json();
    renderNeighbors(data.neighbors || {});
  } catch {
    document.getElementById('p-neighbors').innerHTML =
      '<div style="color:#f472b6;font-size:12px">Erreur API</div>';
  }
}

function renderNeighbors(neighbors) {
  const container = document.getElementById('p-neighbors');
  const entries   = Object.entries(neighbors);
  if (!entries.length) {
    container.innerHTML = '<div style="color:rgba(226,232,240,0.4);font-size:12px">Aucune connexion trouvée.</div>';
    return;
  }
  container.innerHTML = entries.map(([name, info]) => `
    <div class="neighbor-item hop-${info.distance}" onclick="jumpTo('${name}')">
      <div class="n-name">${name}</div>
      <div class="n-meta">
        ${info.distance === 1 ? '→ direct' : `${info.distance} sauts`}
        · ${info.relationship}
        · force ${(info.strength * 100).toFixed(0)}%
      </div>
    </div>
  `).join('');
}

function jumpTo(name) {
  const node = allNodes.find(n => n.id === name);
  if (node && simulation) openPanel(node);
}

function togglePanel() {
  panelOpen = !panelOpen;
  panel.classList.toggle('open', panelOpen);
}

// ── Recherche ─────────────────────────────────────────────────────────────────
function highlightSearch(q) {
  q = q.toLowerCase().trim();
  g.select('#nodes-group').selectAll('g.node')
    .style('opacity', d => {
      if (!q) return 1;
      return d.id.includes(q) ? 1 : 0.15;
    });
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function reload() {
  document.getElementById('loading').classList.remove('hidden');
  document.querySelector('.spinner').style.display = '';
  document.querySelector('#loading p').textContent = 'Actualisation…';
  load();
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
